name: Local core and MCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test persistence, Git connector and MCP with synthetic data
        run: bash test.sh
      - name: Build the native app with the installed macOS SDK
        env:
          NINO_PUBLIC_BUILD: "1"
        run: zsh Source/build.sh
      - name: Package the clean build
        run: ditto -c -k --keepParent Nino.app Nino-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nino-macos-arm64
          path: Nino-ci.zip
          retention-days: 14
